# Keep Gradle within a reasonable memory budget on development machines.
# The machine has 8 GB RAM and the Android emulator uses part of it too.
# Keep Gradle small enough to avoid macOS killing it with exit code -9.
# Use the installed JDK 24 instead of Android Studio's JBR 25, which is
# killed during this project's AGP 9.1 resource-processing phase.
org.gradle.java.home=/Library/Java/JavaVirtualMachines/jdk-24.jdk/Contents/Home
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=128m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.workers.max=1
kotlin.daemon.jvm.options=-Xmx512m
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
